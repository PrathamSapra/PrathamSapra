name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight UTC
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Generate the snake SVG files
        uses: Platane/snk@v3
        with:
          github_user_name: PrathamSapra
          outputs: |
            ./github-contribution-grid-snake.svg
            ./github-contribution-grid-snake-dark.svg

      - name: Commit and push the snake files
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "⚡ Auto-generated GitHub Contribution Snake"
          add: 'github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg'
